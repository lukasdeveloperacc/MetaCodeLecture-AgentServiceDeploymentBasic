services:
  backend:
    platform: linux/amd64
    # 환경 변수로 이미지 URL 동적 설정
    # AWS: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/backend-tf:latest
    # GCP: ${REGION}-docker.pkg.dev/${PROJECT_ID}/agent-tf/backend:latest
    image: ${BACKEND_IMAGE:-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "1234:8000" # host:container
    env_file:
      - ./backend/.env
    networks:
      - agent-network
    # volumes: # mount
    #   - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    platform: linux/amd64
    # 환경 변수로 이미지 URL 동적 설정
    # AWS: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/frontend-tf:latest
    # GCP: ${REGION}-docker.pkg.dev/${PROJECT_ID}/agent-tf/frontend:latest
    image: ${FRONTEND_IMAGE:-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "1235:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agent-network

networks:
  agent-network:
    name: agent-network