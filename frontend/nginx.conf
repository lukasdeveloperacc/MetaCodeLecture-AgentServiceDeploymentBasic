events {
    # worker process 1개가 도이에 처리할 수 있는 최대 연결 수
    worker_connections 1024;
}

http {
    # MIME 타입 매핑 파일 설정 (Content-Type 결정)
    # html > text/html, .css -> text/css 등
    include /etc/nginx/mime.types;

    # mime.types 없는 확장자일 때 기본으로 붙일 Content-Type
    default_type application/octet-stream;

    # 로깅 설정
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    server {
        listen 80;
        server_name localhost;

        # 정적 파일 서빙
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 백엔드 API 프록시 설정 (추가)
        location /api/ {
            # docker-compose의 서비스 이름인 'backend'를 사용합니다.
            # 뒤에 /를 붙여서 /api/ask -> http://backend:8000/ask 로 전달하게 합니다.
            proxy_pass http://backend-alb-1977445004.ap-northeast-2.elb.amazonaws.com/;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # SSE(Streaming)를 위한 설정 (FastAPI 응답용)
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
        }

        # 헬스체크 엔드포인트
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
