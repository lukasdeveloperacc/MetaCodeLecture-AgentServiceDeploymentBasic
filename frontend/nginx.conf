events {
    # worker process 1개가 도이에 처리할 수 있는 최대 연결 수
    worker_connections 1024;
}

http {
    # MIME 타입 매핑 파일 설정 (Content-Type 결정)
    # html > text/html, .css -> text/css 등
    include /etc/nginx/mime.types;

    # mime.types 없는 확장자일 때 기본으로 붙일 Content-Type
    default_type application/octet-stream;

    # 로깅 설정
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    server {
        listen 80;
        server_name localhost;

        # 정적 파일 서빙
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 백엔드 API 프록시 설정 (GCP Cloud Run)
        location /api/ {
            # /api/ask -> https://backend-dev-uyjzr6w3za-du.a.run.app/ask
            proxy_pass https://backend-dev-uyjzr6w3za-du.a.run.app/;

            # HTTP/1.1 필수 (HTTP/1.0은 chunked encoding 미지원)
            proxy_http_version 1.1;

            # SSE 스트리밍을 위한 필수 설정
            proxy_buffering off;           # nginx 버퍼링 비활성화
            proxy_cache off;               # 캐싱 비활성화
            proxy_read_timeout 300s;       # 스트리밍 타임아웃 (5분)

            # 청크 전송 인코딩 활성화
            chunked_transfer_encoding on;

            # SSE 연결 유지를 위한 헤더
            proxy_set_header Connection '';
        }

        # 헬스체크 엔드포인트
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
