name: Deploy to GCP

on:
  push:
    branches:
      - develop
      - staging
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for WIF (Workload Identity Federation)
    # GitHub Environments: develop → development, staging → staging, main → production
    environment: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'staging' && 'staging' || 'development') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ========================================================================
      # Step 1: Create Artifact Registry
      # ========================================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      - name: Generate terraform.tfvars
        working-directory: terraform/gcp
        run: |
          cat > terraform.tfvars <<EOF
          project_id = "${{ vars.GCP_PROJECT_ID }}"
          region = "${{ vars.GCP_REGION }}"
          environment = "${{ vars.ENVIRONMENT }}"
          image_tag = "${{ vars.IMAGE_TAG }}"
          openai_secret_name = "${{ vars.GCP_OPENAI_SECRET_NAME }}"
          pinecone_secret_name = "${{ vars.GCP_PINECONE_SECRET_NAME }}"
          pinecone_index_name = "${{ vars.PINECONE_INDEX_NAME }}"
          backend_cpu = "${{ vars.BACKEND_CPU }}"
          backend_memory = "${{ vars.BACKEND_MEMORY }}"
          backend_min_instances = ${{ vars.BACKEND_MIN_INSTANCES }}
          backend_max_instances = ${{ vars.BACKEND_MAX_INSTANCES }}
          frontend_cpu = "${{ vars.FRONTEND_CPU }}"
          frontend_memory = "${{ vars.FRONTEND_MEMORY }}"
          frontend_min_instances = ${{ vars.FRONTEND_MIN_INSTANCES }}
          frontend_max_instances = ${{ vars.FRONTEND_MAX_INSTANCES }}
          EOF

      - name: Terraform Init
        working-directory: terraform/gcp
        env:
          GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: github-actions@agent-service-terraform.iam.gserviceaccount.com
        run: |
          terraform init \
            -backend-config="bucket=metacode-terraform-state" \
            -backend-config="prefix=agent-service/${{ vars.ENVIRONMENT }}"

      - name: Create Artifact Registry
        working-directory: terraform/gcp
        run: |
          terraform apply -auto-approve \
            -target=google_artifact_registry_repository.agent

          echo "✅ Artifact Registry 생성 완료: agent-${{ vars.ENVIRONMENT }}"

      # ========================================================================
      # Step 2: Build and Push Docker Images
      # ========================================================================

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Create dummy .env file
        run: |
          touch backend/.env

      - name: Build and push images
        env:
          BACKEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agent-${{ vars.ENVIRONMENT }}/backend:${{ vars.IMAGE_TAG }}
          FRONTEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agent-${{ vars.ENVIRONMENT }}/frontend:${{ vars.IMAGE_TAG }}
        run: |
          echo "🐳 Building images for ${{ vars.ENVIRONMENT }} environment"
          echo "Backend: $BACKEND_IMAGE"
          echo "Frontend: $FRONTEND_IMAGE"

          docker compose build
          docker compose push

          echo "✅ Images pushed to Artifact Registry"

      # ========================================================================
      # Step 3: Deploy Infrastructure with Terraform
      # ========================================================================

      - name: Deploy with Terraform
        working-directory: terraform/gcp
        run: |
          echo "🚀 Deploying infrastructure for ${{ vars.ENVIRONMENT }} environment"

          terraform apply -auto-approve

          echo "✅ Terraform apply 완료"

      - name: Deployment summary
        run: |
          echo "## 🎉 GCP 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ vars.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ vars.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ vars.GCP_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ vars.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Resources Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact Registry: agent-${{ vars.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Service: backend-${{ vars.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Service: frontend-${{ vars.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Image: backend:${{ vars.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Image: frontend:${{ vars.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 배포 결과 확인" >> $GITHUB_STEP_SUMMARY
          echo "Terraform outputs로 배포된 리소스 정보를 확인하세요:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cd terraform/gcp" >> $GITHUB_STEP_SUMMARY
          echo "terraform output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
